<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NCC Market</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-alt: #eef3ff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --accent: #10b981;
      --danger: #ef4444;
      --border: #dfe7f5;
      --shadow: 0 16px 32px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--primary-dark);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-btn.active,
    .nav-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .cart-button {
      position: relative;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0.75rem 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(280px, 0.8fr);
      gap: 1.4rem;
      max-width: 1300px;
      margin: 1.5rem auto;
      padding: 0 1.2rem 2rem;
    }

    .panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.35rem;
    }

    .panel.active {
      display: block;
    }

    .toolbar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .search,
    .filter {
      flex: 1;
      min-width: 180px;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
    }

    .status {
      min-height: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
      color: var(--muted);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .product-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      background: #edf3ff;
    }

    .product-content {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem;
      flex: 1;
    }

    .product-top {
      display: flex;
      justify-content: space-between;
      gap: 0.7rem;
      align-items: flex-start;
    }

    .product-title {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.4;
    }

    .product-category {
      background: var(--panel-alt);
      color: var(--primary-dark);
      border-radius: 999px;
      padding: 0.45rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: auto;
    }

    .price {
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .add-btn,
    .checkout-submit,
    .primary-btn,
    .continue-btn,
    .remove-btn,
    .qty-btn {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .add-btn,
    .checkout-submit,
    .primary-btn,
    .continue-btn {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      padding: 0.78rem 1rem;
    }

    .add-btn:hover,
    .checkout-submit:hover,
    .primary-btn:hover,
    .continue-btn:hover,
    .remove-btn:hover,
    .qty-btn:hover {
      transform: translateY(-1px);
    }

    .sidebar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      height: fit-content;
      padding: 1.2rem;
    }

    .cart-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .cart-head h3 {
      margin: 0;
      font-size: 1.4rem;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      padding: 0.75rem;
      border: 1px solid var(--border);
      background: #f9fbff;
      border-radius: 12px;
    }

    .cart-item h4 {
      margin: 0 0 0.2rem;
      font-size: 0.98rem;
    }

    .cart-item-price {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.55rem;
    }

    .qty-btn {
      width: 1.9rem;
      height: 1.9rem;
      background: #e7eefb;
      color: var(--text);
      font-weight: 700;
    }

    .qty-number {
      min-width: 1.4rem;
      text-align: center;
      font-weight: 700;
    }

    .remove-btn {
      background: #fee2e2;
      color: var(--danger);
      padding: 0.5rem 0.75rem;
      font-weight: 700;
      margin-top: 0.35rem;
    }

    .cart-empty {
      display: none;
      padding: 1rem;
      text-align: center;
      border: 1px dashed var(--border);
      background: #f8fafc;
      border-radius: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .cart-empty.visible {
      display: block;
    }

    .cart-footer {
      margin-top: 1.1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .checkout-form {
      display: grid;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      color: var(--text);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .error {
      min-height: 1rem;
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .summary-card {
      display: grid;
      gap: 1.25rem;
    }

    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .summary-header h2 {
      margin: 0;
      font-size: 2rem;
    }

    .badge {
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .summary-info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      background: #f7faff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem;
    }

    .summary-info h3,
    .summary-items h3 {
      margin: 0 0 0.75rem;
      font-size: 1.08rem;
    }

    .summary-info p,
    .summary-items p {
      margin: 0.22rem 0;
      color: var(--muted);
    }

    .summary-items {
      padding: 1rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--border);
    }

    .summary-row:last-child {
      border-bottom: none;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }

    .summary-actions {
      display: flex;
      justify-content: flex-end;
    }

    .continue-btn {
      margin-top: 0.5rem;
    }

    @media (max-width: 860px) {
      .page {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 0.9rem 1rem;
      }

      .nav {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (max-width: 560px) {
      .form-grid,
      .summary-info {
        grid-template-columns: 1fr;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">NCC MARKET</div>
    <nav class="nav" aria-label="Main navigation">
      <button class="nav-btn active" data-view="products">Products</button>
      <button class="nav-btn" data-view="checkout">Checkout</button>
      <button class="nav-btn" data-view="summary">Summary</button>
      <button class="cart-button" id="cartToggle" type="button" aria-label="Open cart">
        Cart
        <span id="cartBadge" class="cart-badge">0</span>
      </button>
    </nav>
  </header>

  <main class="page">
    <section id="productsView" class="panel active" aria-label="Products section">
      <div class="toolbar">
        <input id="searchInput" class="search" type="search" placeholder="Search products by name" aria-label="Search products" />
        <select id="categorySelect" class="filter" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
      </div>
      <div id="statusMessage" class="status">Loading products...</div>
      <div id="productGrid" class="product-grid" aria-live="polite"></div>
    </section>

    <aside class="sidebar" aria-label="Shopping cart panel">
      <div class="cart-head">
        <h3>Your Cart</h3>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <div id="cartEmpty" class="cart-empty visible">Your cart is empty</div>
      <div class="cart-footer">
        <div class="total-row">
          <span>Total</span>
          <span id="cartTotal">$0.00</span>
        </div>
        <button type="button" id="checkoutButton" class="primary-btn" style="width:100%;">Proceed to Checkout</button>
      </div>
    </aside>

    <section id="checkoutView" class="panel" aria-label="Checkout section">
      <div class="summary-header">
        <h2>Checkout</h2>
        <span class="badge">Secure</span>
      </div>
      <form id="checkoutForm" class="checkout-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="fullName">Full Name</label>
            <input id="fullName" name="fullName" type="text" placeholder="John Doe" />
            <span class="error" data-error-for="fullName"></span>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="john@example.com" />
            <span class="error" data-error-for="email"></span>
          </div>

          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" placeholder="0712345678" />
            <span class="error" data-error-for="phone"></span>
          </div>

          <div class="field full">
            <label for="address">Delivery Address</label>
            <textarea id="address" name="address" placeholder="123 Market Street, City"></textarea>
            <span class="error" data-error-for="address"></span>
          </div>
        </div>

        <button type="submit" class="checkout-submit" style="width: 100%;">Place Order</button>
      </form>
    </section>

    <section id="summaryView" class="panel" aria-label="Order summary section">
      <div id="summaryContent" class="summary-card"></div>
    </section>
  </main>
</body>
</html>
